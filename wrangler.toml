name = "terabox"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

# Preserve dashboard-only plain-text vars across every deploy. Per-instance
# config (PATH, ROOT_ID, LOG_PREFIX — each deployer's own values) lives in
# THEIR dashboard, never in this shared file, and must not be wiped when a
# push re-deploys. Secrets are never deleted by deploys either way.
keep_vars = true

[observability]
enabled = true

# Shared non-sensitive defaults live HERE, so every deployment re-applies
# them. Per-instance vars stay in each deployer's dashboard (preserved via
# `keep_vars = true` above). CREDENTIALS (USERS/COOKIE/JSTOKEN) must be set
# as *Secrets* in the dashboard only: this repo is public, never put them
# here as plain text.
[vars]
TERABOX_DOMAIN = "https://dm.terabox.com"
MIN_GAP_MS = "400"

# Advisory WebDAV state (locks + dead props) for the WHOLE account lives in
# one Durable Object: every isolate talks to the same serialized instance,
# so Cloudflare's isolate scheduling can no longer make lock enforcement
# flaky. Class `DavState` is exported from src/index.ts (via src/davstate.ts)
# and was pre-created in the dashboard (namespace `dav-state`); the worker
# falls back to per-isolate memory state if the binding is ever removed.
[[durable_objects.bindings]]
name = "DAV_STATE"
class_name = "DavState"

# The class already exists on this account (pre-created in the dashboard:
# namespace `dav-state`, SQLite). The [exports] entry below declares its
# lifecycle — wrangler reconciles exports on every deploy, creating the
# class automatically on fresh accounts. `migrations` and `exports` are
# mutually exclusive, so no [[migrations]] block may coexist with it.
[exports.DavState]
type = "durable-object"
storage = "sqlite"

# Optional base path the WebDAV surface is served under (gdrive parity),
# e.g. serve only below /dav/ — requests outside it 404:
# vars = { PATH = "/dav/" }

# Optional Terabox folder mounted as the WebDAV root (gdrive parity with
# ROOT_ID; Terabox identifies folders by path), e.g. only expose /backup:
# vars = { ROOT_ID = "/backup" }

# Comma or newline separated "user:password". Reject all requests when unset.
# vars = { USERS = "user:pass" }

# Terabox session cookie. Full cookie string or bare "ndus" value.
# vars = { COOKIE = "ndus=...; lang=en" }