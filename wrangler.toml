name = "terabox"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

# Preserve dashboard-only plain-text vars across every deploy: ALL runtime
# config is per-instance and user-made in each deployer's dashboard, never
# in this shared file, so a push must not wipe it. Secrets are never
# deleted by deploys either way.
keep_vars = true

[observability]
enabled = true

# NO [vars] in this file — every environment value is user-made in the
# deployer's dashboard (preserved by `keep_vars = true` above):
#
#   Secrets   (genuine credentials — dashboard type "Secret", never plain):
#             USERS, COOKIE, JSTOKEN
#
#   Variables (plain, all optional — code defaults apply when unset):
#             TERABOX_DOMAIN  origin mirror; default https://www.terabox.com
#                             — REGIONAL accounts must set their own (this
#                             account: https://dm.terabox.com), otherwise
#                             the cookie is rejected (errno -6)
#             MIN_GAP_MS      pacing between Terabox calls (default 400)
#             PATH            base path the WebDAV lives under (e.g. /dav/)
#             ROOT_ID         Terabox folder mounted as the WebDAV root
#             LOG_PREFIX      optional log tag
#
# This repo is public: never commit credentials or instance config here.

# Advisory WebDAV state (locks + dead props) for the WHOLE account lives in
# one Durable Object: every isolate talks to the same serialized instance,
# so Cloudflare's isolate scheduling can no longer make lock enforcement
# flaky. Class `DavState` is exported from src/index.ts (via src/davstate.ts)
# and was pre-created in the dashboard (namespace `dav-state`); the worker
# falls back to per-isolate memory state if the binding is ever removed.
[[durable_objects.bindings]]
name = "DAV_STATE"
class_name = "DavState"

# The class already exists on this account (pre-created in the dashboard:
# namespace `dav-state`, SQLite). The [exports] entry below declares its
# lifecycle — wrangler reconciles exports on every deploy, creating the
# class automatically on fresh accounts. `migrations` and `exports` are
# mutually exclusive, so no [[migrations]] block may coexist with it.
[exports.DavState]
type = "durable-object"
storage = "sqlite"

# Optional base path the WebDAV surface is served under (gdrive parity),
# e.g. serve only below /dav/ — requests outside it 404:
# vars = { PATH = "/dav/" }

# Optional Terabox folder mounted as the WebDAV root (gdrive parity with
# ROOT_ID; Terabox identifies folders by path), e.g. only expose /backup:
# vars = { ROOT_ID = "/backup" }

# USERS and COOKIE are Secrets — set them per-instance in the dashboard
# (Settings → Variables and Secrets) or with `wrangler secret put`, never
# as commented-out vars in this public file. The Terabox cookie must be the
# FULL browser cookie string (ndus + stoken + …); a bare ndus value is
# gated by Terabox now (400141). See README "Setup".