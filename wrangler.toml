name = "terabox"
main = "src/index.ts"
compatibility_date = "2024-12-01"
workers_dev = true
preview_urls = true

[observability]
enabled = true

# Comma or newline separated "user:password". Reject all requests when unset.
# vars = { USERS = "user:pass" }

# Terabox session cookie. Full cookie string or bare "ndus" value.
# vars = { COOKIE = "ndus=...; lang=en" }

# Optional alternate Terabox mirror host (defaults to https://www.terabox.com).
# vars = { TERABOX_DOMAIN = "https://www.terabox.com" }