name = "davbox"
main = "src/index.ts"
# Newest runtime date the test toolchain can execute (workerd 2026-06-25 in
# @cloudflare/vitest-pool-workers). Bumped from 2024-12-01 after auditing
# every flag this date enables against the code: no Node/Python/container/
# Workers-Assets/WebSocket/Queue surface is used; streams are only passed
# through as `response.body` (no TransformStream or writer use); outbound
# fetches never carry `Authorization` (so cross-origin redirect stripping is
# inert); request bodies are BufferSource, not iterables. The three flags
# between this date and Wrangler's newest (2026-10-01) are Python-only,
# `dispatchEvent()` exception handling and `HTMLRewriter` ESI — none used.
# The suite runs this exact date (vitest.config.mts reads this line), so a
# runtime regression fails `npm run review` instead of production. Raising
# it further requires a newer vitest-pool-workers first.
compatibility_date = "2026-07-02"
workers_dev = true
preview_urls = true

# Preserve dashboard-only plain-text vars across every deploy: ALL runtime
# config is per-instance and user-made in each deployer's dashboard, never
# in this shared file, so a push must not wipe it. Secrets are never
# deleted by deploys either way.
keep_vars = true

# No [placement] block — deliberately. Worker Placement was tested end to
# end for the "slow downloads" report: Smart never moved (all traffic
# enters at HKG), and the Region hint `aws:ap-northeast-1` ran the worker
# at remote-NRT yet measured the identical ~1.8 MB/s cap (HKG 1.80 vs NRT
# 1.83 on the same 70 MB file). That cap is TeraBox's free-tier CDN speed
# (docs/terabox-limits.md: md5-verified, same aggregate under 4 parallel
# ranges, every colo), not egress location — placement only bought
# cross-region Durable Object latency. Revisit only if that doc changes.

[observability]
enabled = true

# Visual traces per request (waterfall of handler → Durable Object → TeraBox
# fetches) with no code changes. Beta, free-plan included, and sampling is
# set to a fraction because a WebDAV client can issue many requests per
# action; 0.1 still samples enough to diagnose a slow mount without filling
# the dashboard. Raise to 1 while actively investigating a report.
[observability.traces]
enabled = true
head_sampling_rate = 0.1

# NO [vars] in this file — every environment value is user-made in the
# deployer's dashboard (preserved by `keep_vars = true` above):
#
#   Secrets   (genuine credentials — dashboard type "Secret", never plain):
#             USERS, COOKIE, JSTOKEN
#
#   Variables (plain, all optional — code defaults apply when unset):
#             TERABOX_DOMAIN  origin mirror; default https://www.terabox.com
#                             — REGIONAL accounts must set their own (this
#                             account: https://dm.terabox.com), otherwise
#                             the cookie is rejected (errno -6)
#             MIN_GAP_MS      pacing between Terabox calls (default 400)
#             MAX_CHUNK_BYTES chunk-size cap in bytes for slotted uploads
#                             (default 4194304 = the smallest slice TeraBox
#                             accepts for a splitting upload; smaller full
#                             parts are refused upstream with 31299. Raise
#                             it on Workers paid to unlock the tier's larger
#                             premium buckets — 8-32 MiB parts mean fewer,
#                             faster requests. Free-plan deployments cannot
#                             complete >4 GiB sessions: 4-8 MiB parts hit
#                             the 1102 CPU-limit wall late-session)
#             PATH            base path the WebDAV lives under (e.g. /dav/)
#             ROOT_ID         Terabox folder mounted as the WebDAV root
#             LOG_PREFIX      optional log tag
#
# This repo is public: never commit credentials or instance config here.

# Advisory WebDAV state (locks + dead props) for the WHOLE account lives in
# one Durable Object: every isolate talks to the same serialized instance,
# so Cloudflare's isolate scheduling can no longer make lock enforcement
# flaky. Class `DavState` is exported from src/index.ts (via src/davstate.ts)
# and was pre-created in the dashboard (namespace `dav-state`); the worker
# falls back to per-isolate memory state if the binding is ever removed.
[[durable_objects.bindings]]
name = "DAV_STATE"
class_name = "DavState"

# The class already exists on this account (pre-created in the dashboard:
# namespace `dav-state`, SQLite). The [exports] entry below declares its
# lifecycle — wrangler reconciles exports on every deploy, creating the
# class automatically on fresh accounts. `migrations` and `exports` are
# mutually exclusive, so no [[migrations]] block may coexist with it.
[exports.DavState]
type = "durable-object"
storage = "sqlite"

# Optional base path the WebDAV surface is served under (gdrive parity),
# e.g. serve only below /dav/ — requests outside it 404:
# vars = { PATH = "/dav/" }

# Optional Terabox folder mounted as the WebDAV root (gdrive parity with
# ROOT_ID; Terabox identifies folders by path), e.g. only expose /backup:
# vars = { ROOT_ID = "/backup" }

# USERS and COOKIE are Secrets — set them per-instance in the dashboard
# (Settings → Variables and Secrets) or with `wrangler secret put`, never
# as commented-out vars in this public file. Only the `ndus` cookie is
# required — a bare value is accepted (the worker normalizes it to
# `ndus=…; lang=en`); full cookie strings also work. `stoken` is not a
# TeraBox field. See README "Getting your TeraBox COOKIE".